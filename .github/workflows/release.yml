# Builds swapp for Windows (server) and Linux (client), publishes both as the
# only release, then deletes every other release, tag, workflow run and
# artifact so the repo only ever holds the latest build.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push supersedes an in-flight build; the cleanup below would try to
# delete the older run anyway.
concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write # create/delete releases and tags
  actions: write  # delete workflow runs and artifacts

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # NMake ships with MSVC, so no extra generator has to be installed.
      - name: Build
        run: |
          cmake -S . -B build-windows -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed." }
          cmake --build build-windows
          if ($LASTEXITCODE -ne 0) { throw "Build failed." }

      # The app loads assets/ from beside the binary, so they ship together.
      - name: Package
        run: |
          New-Item -ItemType Directory -Force dist/swapp | Out-Null
          Copy-Item build-windows/swapp.exe dist/swapp/
          Copy-Item -Recurse build-windows/assets dist/swapp/
          Compress-Archive -Path dist/swapp -DestinationPath swapp-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: swapp-windows
          path: swapp-windows-x64.zip
          retention-days: 1

  build-linux:
    # The oldest supported runner, so the binary links against an old glibc
    # and still runs on whatever the client laptop has.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            libgtk-3-dev libayatana-appindicator3-dev libnotify-dev libx11-dev \
            libi2c-dev libglib2.0-dev

      - name: Build
        run: |
          cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-linux

      - name: Package
        run: |
          mkdir -p dist/swapp
          cp build-linux/swapp dist/swapp/
          cp -r build-linux/assets dist/swapp/
          tar -C dist -czf swapp-linux-x64.tar.gz swapp

      - uses: actions/upload-artifact@v4
        with:
          name: swapp-linux
          path: swapp-linux-x64.tar.gz
          retention-days: 1

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: build-${{ github.run_number }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "swapp build ${{ github.run_number }}" \
            --notes "Built from ${GITHUB_SHA::7}." \
            --latest

      - name: Delete older releases and their tags
        run: |
          gh release list --limit 1000 --json tagName --jq '.[].tagName' |
            while read -r tag; do
              [ "$tag" = "$TAG" ] && continue
              echo "Deleting release $tag"
              gh release delete "$tag" --cleanup-tag --yes || true
            done

      # Everything is in the release now; this run's own artifacts included.
      - name: Delete all artifacts
        run: |
          gh api --paginate "repos/$GH_REPO/actions/artifacts" --jq '.artifacts[].id' |
            while read -r id; do
              echo "Deleting artifact $id"
              gh api -X DELETE "repos/$GH_REPO/actions/artifacts/$id" || true
            done

      # Runs still in progress can't be deleted; they're either this one or
      # a newer run that will clean up after itself.
      - name: Delete other workflow runs
        run: |
          gh api --paginate "repos/$GH_REPO/actions/runs" --jq '.workflow_runs[].id' |
            while read -r id; do
              [ "$id" = "$GITHUB_RUN_ID" ] && continue
              echo "Deleting run $id"
              gh api -X DELETE "repos/$GH_REPO/actions/runs/$id" || true
            done
