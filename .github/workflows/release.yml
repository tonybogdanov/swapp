# Builds swapp for Windows (server) and Linux (client), publishes both
# single-file binaries as the one release, titled "swapp", then deletes every
# older release, tag, workflow run and artifact.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push supersedes an in-flight build; the cleanup below would try to
# delete the older run anyway.
concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write # create/delete releases and tags
  actions: write  # delete workflow runs and artifacts

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # The MSVC environment comes straight from vcvars64.bat rather than a
      # setup action: the usual one (ilammy/msvc-dev-cmd) still targets the
      # deprecated Node 20 runtime. NMake ships with MSVC, so no extra
      # generator has to be installed.
      - name: Build
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS=%%i"
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake -S . -B build-windows -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release || exit /b 1
          cmake --build build-windows || exit /b 1

      - uses: actions/upload-artifact@v7
        with:
          name: swapp-windows
          path: build-windows/swapp.exe
          retention-days: 1

  build-linux:
    # The oldest supported runner, so the binary links against an old glibc
    # and still runs on whatever the client laptop has.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            libgtk-3-dev libayatana-appindicator3-dev libnotify-dev libx11-dev \
            libi2c-dev libglib2.0-dev libcurl4-openssl-dev

      - name: Build
        run: |
          cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-linux

      - uses: actions/upload-artifact@v7
        with:
          name: swapp-linux
          path: build-linux/swapp
          retention-days: 1

  release:
    needs: [build-windows, build-linux]
    # Pinned rather than ubuntu-latest, which moves to Ubuntu 26 from
    # 2026-10-19; this job only runs gh, so any current image will do.
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # A fresh tag per build, never reused. With one fixed tag, recreated
      # each time, GitHub kept serving the deleted release's files from
      # /releases/download/<tag>/ for a while after publishing, so the app's
      # update check saw the old version. The release title stays "swapp".
      TAG: build-${{ github.run_number }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # The installed app's update check reads this: the hash the binaries
      # were built from, as CMake baked it in.
      - name: Write version file
        run: echo "${GITHUB_SHA::7}" > dist/version.txt

      # Published before the old ones go, so "latest" never points nowhere.
      - name: Publish release
        run: |
          gh release create "$TAG" dist/swapp.exe dist/swapp dist/version.txt \
            --target "$GITHUB_SHA" \
            --title "swapp" \
            --notes "Built from ${GITHUB_SHA::7}." \
            --latest

      - name: Delete old releases and their tags
        run: |
          gh release list --limit 1000 --json tagName --jq '.[].tagName' |
            while read -r tag; do
              [ "$tag" = "$TAG" ] && continue
              echo "Deleting release $tag"
              gh release delete "$tag" --cleanup-tag --yes
            done

      # Everything is in the release now; this run's own artifacts included.
      - name: Delete all artifacts
        run: |
          gh api --paginate "repos/$GH_REPO/actions/artifacts" --jq '.artifacts[].id' |
            while read -r id; do
              echo "Deleting artifact $id"
              gh api -X DELETE "repos/$GH_REPO/actions/artifacts/$id" || true
            done

      # Runs still in progress can't be deleted; they're either this one or
      # a newer run that will clean up after itself.
      - name: Delete other workflow runs
        run: |
          gh api --paginate "repos/$GH_REPO/actions/runs" --jq '.workflow_runs[].id' |
            while read -r id; do
              [ "$id" = "$GITHUB_RUN_ID" ] && continue
              echo "Deleting run $id"
              gh api -X DELETE "repos/$GH_REPO/actions/runs/$id" || true
            done
